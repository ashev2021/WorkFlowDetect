version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zapier-workflow-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - zapier-network
    restart: unless-stopped

networks:
  zapier-network:
    driver: bridge